<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Human authority and agent capacity in an AI editorial team</title>
  <desc id="desc">The human editor-in-chief sets direction, owns the evidence, judges feedback and signs off publication. The AI editorial team produces alternatives, checks consistency, challenges usefulness and maintains the artifact.</desc>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #1c1917; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #57534e; }
    .role { font-size: 22px; font-weight: 700; }
    .badge { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    .item-title { font-size: 17px; font-weight: 700; }
    .item-detail { font-size: 14px; fill: #57534e; }
    .shared-title { font-size: 18px; font-weight: 700; }
    .shared-detail { font-size: 15px; fill: #57534e; }
    .flow { font-size: 16px; font-weight: 700; }
    .footer { font-size: 21px; font-weight: 700; }
  </style>

  <rect width="1200" height="790" fill="#f8f6f1"/>
  <text x="54" y="58" class="title">Build an editorial team, not an AI writer</text>
  <text x="54" y="88" class="subtitle">Agents scale editorial capacity. Humans retain editorial authority.</text>

  <rect x="54" y="120" width="528" height="430" rx="20" fill="#ffffff" stroke="#d6d3d1"/>
  <rect x="54" y="120" width="528" height="8" rx="4" fill="#d97706"/>
  <circle cx="92" cy="168" r="20" fill="#fef3c7"/>
  <text x="92" y="175" text-anchor="middle" class="role">H</text>
  <text x="126" y="175" class="role">Human editor-in-chief</text>
  <rect x="430" y="151" width="118" height="30" rx="15" fill="#fef3c7"/>
  <text x="489" y="171" text-anchor="middle" class="badge">AUTHORITY</text>

  <circle cx="92" cy="225" r="6" fill="#d97706"/>
  <text x="114" y="222" class="item-title">Set direction</text>
  <text x="114" y="245" class="item-detail">Thesis, point of view and intended audience</text>
  <line x1="82" y1="266" x2="554" y2="266" stroke="#e7e5e4"/>

  <circle cx="92" cy="302" r="6" fill="#d97706"/>
  <text x="114" y="299" class="item-title">Own the evidence</text>
  <text x="114" y="322" class="item-detail">Practice, source relevance and defensible claims</text>
  <line x1="82" y1="343" x2="554" y2="343" stroke="#e7e5e4"/>

  <circle cx="92" cy="379" r="6" fill="#d97706"/>
  <text x="114" y="376" class="item-title">Judge the feedback</text>
  <text x="114" y="399" class="item-detail">Accept, reject or reconcile competing advice</text>
  <line x1="82" y1="420" x2="554" y2="420" stroke="#e7e5e4"/>

  <circle cx="92" cy="456" r="6" fill="#d97706"/>
  <text x="114" y="453" class="item-title">Cut and publish</text>
  <text x="114" y="476" class="item-detail">Final coherence, accountability and sign-off</text>

  <rect x="618" y="120" width="528" height="430" rx="20" fill="#ffffff" stroke="#d6d3d1"/>
  <rect x="618" y="120" width="528" height="8" rx="4" fill="#0f766e"/>
  <circle cx="656" cy="168" r="20" fill="#ccfbf1"/>
  <text x="656" y="175" text-anchor="middle" class="role">A</text>
  <text x="690" y="175" class="role">AI editorial team</text>
  <rect x="1000" y="151" width="112" height="30" rx="15" fill="#ccfbf1"/>
  <text x="1056" y="171" text-anchor="middle" class="badge">CAPACITY</text>

  <circle cx="656" cy="225" r="6" fill="#0f766e"/>
  <text x="678" y="222" class="item-title">Produce alternatives</text>
  <text x="678" y="245" class="item-detail">Draft, restructure and synthesize variants</text>
  <line x1="646" y1="266" x2="1118" y2="266" stroke="#e7e5e4"/>

  <circle cx="656" cy="302" r="6" fill="#0f766e"/>
  <text x="678" y="299" class="item-title">Check the whole</text>
  <text x="678" y="322" class="item-detail">Content checker for style and consistency</text>
  <line x1="646" y1="343" x2="1118" y2="343" stroke="#e7e5e4"/>

  <circle cx="656" cy="379" r="6" fill="#0f766e"/>
  <text x="678" y="376" class="item-title">Challenge usefulness</text>
  <text x="678" y="399" class="item-detail">Developer and engineering-manager personas</text>
  <line x1="646" y1="420" x2="1118" y2="420" stroke="#e7e5e4"/>

  <circle cx="656" cy="456" r="6" fill="#0f766e"/>
  <text x="678" y="453" class="item-title">Maintain the artifact</text>
  <text x="678" y="476" class="item-detail">Verification, repository sync, export and repair</text>

  <rect x="172" y="582" width="856" height="72" rx="18" fill="#ffffff" stroke="#d6d3d1"/>
  <text x="600" y="612" text-anchor="middle" class="shared-title">Shared editorial workspace</text>
  <text x="600" y="637" text-anchor="middle" class="shared-detail">Structure · examples · revision loops · traceable decisions</text>

  <rect x="86" y="688" width="272" height="48" rx="24" fill="#fef3c7"/>
  <text x="222" y="718" text-anchor="middle" class="flow">Human sets direction</text>
  <path d="M376 712h54" stroke="#78716c" stroke-width="3"/>
  <path d="M422 703l10 9-10 9" fill="none" stroke="#78716c" stroke-width="3"/>
  <rect x="448" y="688" width="304" height="48" rx="24" fill="#ccfbf1"/>
  <text x="600" y="718" text-anchor="middle" class="flow">Agents produce &amp; challenge</text>
  <path d="M770 712h54" stroke="#78716c" stroke-width="3"/>
  <path d="M816 703l10 9-10 9" fill="none" stroke="#78716c" stroke-width="3"/>
  <rect x="842" y="688" width="272" height="48" rx="24" fill="#fef3c7"/>
  <text x="978" y="718" text-anchor="middle" class="flow">Human decides &amp; publishes</text>

  <text x="600" y="775" text-anchor="middle" class="footer">Production can be agent-driven. Meaning remains human-owned.</text>
</svg>
