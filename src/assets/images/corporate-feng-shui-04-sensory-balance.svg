<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-labelledby="title-sensory desc-sensory"><title id="title-sensory">What is the room asking of your senses?</title><desc id="desc-sensory">Light, sound, screens, and objects can compete for attention.</desc><defs><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3 L0 6 Z" fill="#537E9C"/></marker><marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3 L0 6 Z" fill="#C97452"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3 L0 6 Z" fill="#5B8A75"/></marker></defs><rect width="1280" height="740" fill="#FAF9F5"/><text x="48" y="61" font-size="34" fill="#2C3840" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">What is the room asking of your senses?</text><text x="48" y="92" font-size="19" fill="#61727B" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Light, sound, screens, and objects can compete for attention.</text><rect x="40" y="120" width="575" height="545" rx="16" fill="#FFFFFF" stroke="#DAE1E0" stroke-width="2"/><text x="66" y="161" font-size="27" fill="#2C3840" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">COMPETING SIGNALS</text><text x="66" y="188" font-size="18" fill="#61727B" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">When too many things demand attention</text><rect x="665" y="120" width="575" height="545" rx="16" fill="#FFFFFF" stroke="#DAE1E0" stroke-width="2"/><text x="691" y="161" font-size="27" fill="#2C3840" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">CLEARER SIGNALS</text><text x="691" y="188" font-size="18" fill="#61727B" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">When one thing has room to be noticed</text><rect x="92" y="226" width="470" height="353" rx="3" fill="#FFFDF9"/><path d="M534.6 580 H563 V225 H91 V580 H468.6" stroke="#2C3840" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M468.6 580 V518 A62 62 0 0 1 530.6 580" stroke="#61727B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 468.6 580 L 530.6 518" stroke="#61727B" stroke-width="2" fill="none" stroke-linecap="round" /><rect x="716" y="226" width="470" height="353" rx="3" fill="#FFFDF9"/><path d="M1158.6 580 H1187 V225 H715 V580 H1092.6" stroke="#2C3840" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M1092.6 580 V518 A62 62 0 0 1 1154.6 580" stroke="#61727B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1092.6 580 L 1154.6 518" stroke="#61727B" stroke-width="2" fill="none" stroke-linecap="round" /><rect x="184" y="316" width="241" height="132" rx="18" fill="#E9DFC9" stroke="#2C3840" stroke-width="3"/><rect x="802" y="316" width="241" height="132" rx="18" fill="#E9DFC9" stroke="#2C3840" stroke-width="3"/><path d="M115 252 Q210 310 300 260" fill="none" stroke="#C97452" stroke-width="9" opacity=".3"/><path d="M140 488 Q220 450 305 506" fill="none" stroke="#C97452" stroke-width="8" opacity=".35"/><path d="M183 243 Q226 220 266 243 M193 257 Q226 239 256 257" stroke="#C97452" stroke-width="4" fill="none"/><text x="215" y="278" font-size="17" fill="#C97452" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">NOISE</text><rect x="310" y="247" width="156" height="27" rx="4" fill="#F9E7DD" stroke="#C97452" stroke-width="2"/><text x="388" y="266" font-size="15" fill="#C97452" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">STATUS ALERTS</text><rect x="315" y="291" width="156" height="18" rx=